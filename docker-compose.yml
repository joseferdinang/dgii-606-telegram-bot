services:
  bot606:
    build: .
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
      STATE_DB_PATH: /app/data/state/bot606.sqlite3
      EXPORT_DIRECTORY: /app/data/exports
    volumes:
      - bot606_data:/app/data
      - ./credentials:/app/credentials:ro
    init: true
    restart: unless-stopped

volumes:
  bot606_data:
